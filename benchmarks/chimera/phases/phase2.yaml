# Chimera Phase 2: Logging Infrastructure Refactoring
#
# Acceptance Criteria:
# - utils/logging_config.py exists with central configuration
# - All modules use standard Python logging
# - LegacyLogger removed from all files
# - All tests still pass

runId: "chimera-phase2-${AGENT:-plan}-${MODEL:-google:antigravity-gemini-3-flash}${RUN_TAG:+-${RUN_TAG}}"
agent: "${AGENT:-plan}"
model:
  id: "${MODEL:-google:antigravity-gemini-3-flash}"
  contextWindow: ${MODEL_CTX:-1000000}
  outputLimit: ${MODEL_OUTPUT:-65536}
path: "${TESTBED_PATH}"
outputDir: "${OUTPUT_DIR:-./out}"
baseUrl: "${OPENCODE_URL:-http://127.0.0.1:4096}"
prompts:
  - |
    Execute Phase 2 from OPTI_SPEC.md: Logging Infrastructure Refactoring
    
    1. Create utils/logging_config.py with central logging configuration
    2. Replace LegacyLogger with standard Python logging in ALL modules
    3. Ensure unified log output across Gateway, Core, and Utils layers
    4. Run tests to verify nothing is broken
