# Phoenix Full Benchmark
# Runs all phases as defined in OPTI_SPEC.md
#
# Usage:
#   1. Create testbed: ./scripts/testbed.sh create phoenix-full -b phoenix/baseline
#   2. Run: node dist/index.js -c benchmarks/phoenix/full_benchmark.yaml

runId: "phoenix-full-${AGENT:-build}-${MODEL:-google:antigravity-gemini-3-flash}${RUN_TAG:+-${RUN_TAG}}"
agent: "${AGENT:-build}"
model:
  id: "${MODEL:-google:antigravity-gemini-3-flash}"
  contextWindow: ${MODEL_CTX:-1000000}
  outputLimit: ${MODEL_OUTPUT:-65536}
path: "${TESTBED_PATH}" # Set via environment or replace with absolute path
outputDir: "${OUTPUT_DIR:-./out}"
baseUrl: "${OPENCODE_URL:-http://127.0.0.1:4096}"
prompts:
  - |
    Read the OPTI_SPEC.md file in this project and execute ALL phases (0-4) in order.

    For each phase:
    1. Understand the requirements
    2. Implement the changes
    3. Verify the acceptance criteria are met
    4. Proceed to the next phase

    Report your progress after each phase completion.
